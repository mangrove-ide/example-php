name: Test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            # The org only allows actions/*; ubuntu runners ship PHP 8.3 with pdo_sqlite and Composer.
            - run: php -v && php -m | grep -i pdo_sqlite
            - run: composer install --no-interaction --no-progress
            - run: composer test

    frontend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            - run: npm test
